<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Talkie App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="call-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; color:white; flex-direction:column;">
        <h2 id="call-status">مكالمة واردة...</h2>
        <div id="incomingActionBtns" style="display:flex; gap:10px; margin-top:20px;">
            <button onclick="acceptCall()">قبول</button>
        </div>
        <button id="endCallOnlyBtn" style="display:none; margin-top:20px;" onclick="endCall()">إنهاء المكالمة</button>
    </div>

    <audio id="ringSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
