<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Talkie - جهاز لاسلكي</title>
    <!-- مكتبة تسجيل الدخول بجوجل -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 30px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        /* شاشة تسجيل الدخول */
        #login-screen {
            display: block;
        }
        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        /* شاشة اللاسلكي الرئيسي (مخفية بالبداية) */
        #main-screen {
            display: none;
        }
        .user-header {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #4caf50;
            font-weight: bold;
        }
        .talk-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background-color: #e53935;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.1s, background-color 0.2s;
        }
        .talk-btn:active {
            transform: scale(0.95);
            background-color: #c62828;
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📻 Walkie Talkie</h2>

        <!-- 1️⃣ شاشة الدخول أول ما يفتح الموقع -->
        <div id="login-screen">
            <p>يرجى تسجيل الدخول للبدء:</p>
            <div class="google-btn-container">
                <div id="g_id_onload"
                     data-client_id="456439585406-9db1t4v6ivjkipdhmgoun7p7q3tfllku.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard"></div>
            </div>
        </div>

        <!-- 2️⃣ شاشة التطبيق والتحدث (تظهر بعد الدخول) -->
        <div id="main-screen">
            <div id="user-info" class="user-header"></div>
            <button id="talkBtn" class="talk-btn">اضغط للتحدث 🎙️</button>
            <div class="status" id="status">الحالة: جاهز للاتصال 🟢</div>
        </div>
    </div>

    <!-- مكتبة Socket.io للاتصال المباشر -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const loginScreen = document.getElementById('login-screen');
        const mainScreen = document.getElementById('main-screen');
        const userInfo = document.getElementById('user-info');
        const talkBtn = document.getElementById('talkBtn');
        const statusText = document.getElementById('status');

        // دالة استقبال بيانات وتسجيل الدخول
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            
            // إخفاء شاشة الدخول وإظهار التطبيق الرئيسي
            loginScreen.style.display = "none";
            mainScreen.style.display = "block";

            // عرض اسم المستخدم
            userInfo.innerHTML = `المستخدم: ${responsePayload.name} 👤`;
        }

        // فك تشفير بيانات جوجل
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // أحداث التحدث
        talkBtn.addEventListener('mousedown', startTalking);
        talkBtn.addEventListener('mouseup', stopTalking);
        talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
        talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

        function startTalking() {
            statusText.innerText = "الحالة: جارٍ الإرسال... 🔴";
            statusText.style.color = "#ff5252";
        }

        function stopTalking() {
            statusText.innerText = "الحالة: جاهز للاتصال 🟢";
            statusText.style.color = "#4caf50";
        }
    </script>
</body>
</html>
