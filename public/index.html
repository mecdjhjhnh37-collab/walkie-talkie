<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Talkie - Mecd Developer</title>
    <!-- مكتبة تسجيل الدخول بجوجل -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 420px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        /* 1️⃣ شاشة الترحيب بالمطور والدخول */
        #login-screen { display: block; }
        .dev-badge {
            background: linear-gradient(45deg, #ff9800, #e91e63);
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.6;
        }
        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        /* 2️⃣ شاشة قائمة المحادثات (مثل واتساب) */
        #chats-screen { display: none; }
        .user-header {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #4caf50;
            font-weight: bold;
            font-size: 14px;
        }
        .create-btn {
            width: 100%;
            background: #2196f3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .chat-list { list-style: none; padding: 0; margin: 0; }
        .chat-item {
            background: #2c2c2e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-item:hover { background: #3a3a3c; }
        .chat-title { font-weight: bold; font-size: 15px; }

        /* 3️⃣ شاشة اللاسلكي داخل الغرفة */
        #talk-screen { display: none; }
        .back-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            float: right;
            font-size: 12px;
        }
        .talk-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background-color: #e53935;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.1s, background-color 0.2s;
            margin-top: 25px;
        }
        .talk-btn:active {
            transform: scale(0.95);
            background-color: #c62828;
        }
        .status { margin-top: 20px; font-size: 14px; color: #bbb; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1️⃣ شاشة الترحيب وتسجيل الدخول -->
        <div id="login-screen">
            <div class="dev-badge">
                👋 أهلاً بك في موقع المطور مجد <br>
                <span style="font-size: 13px; opacity: 0.95;">Geliştirici Mecd'in Sitesine Hoş Geldiniz</span>
            </div>
            <h3>📻 Walkie Talkie</h3>
            <p style="color: #aaa; font-size: 14px;">يرجى تسجيل الدخول للانضمام للمحادثات:</p>
            
            <div class="google-btn-container">
                <div id="g_id_onload"
                     data-client_id="456439585406-9db1t4v6ivjkipdhmgoun7p7q3tfllku.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard"></div>
            </div>
        </div>

        <!-- 2️⃣ شاشة المحادثات (مثل واتساب) -->
        <div id="chats-screen">
            <div id="user-info" class="user-header"></div>
            
            <button class="create-btn" onclick="createNewRoom()">➕ إنشاء غرفة محادثة جديدة</button>
            
            <h4 style="text-align: right; margin-bottom: 10px; color: #888;">الغرف المتاحة 💬</h4>
            <div class="chat-list" id="roomsContainer">
                <!-- الغرف تنزل هنا تلقائياً -->
            </div>
        </div>

        <!-- 3️⃣ شاشة اللاسلكي داخل الغرفة -->
        <div id="talk-screen">
            <button class="back-btn" onclick="backToChats()">← رجوع</button>
            <h3 id="current-room-title" style="margin-top:0;">غرفة المحادثة</h3>
            <button id="talkBtn" class="talk-btn">اضغط للتحدث 🎙️</button>
            <div class="status" id="status">الحالة: جاهز للاتصال 🟢</div>
        </div>
    </div>

    <!-- مكتبة Socket.io للاتصال المباشر -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const loginScreen = document.getElementById('login-screen');
        const chatsScreen = document.getElementById('chats-screen');
        const talkScreen = document.getElementById('talk-screen');
        const userInfo = document.getElementById('user-info');
        const roomsContainer = document.getElementById('roomsContainer');
        const currentRoomTitle = document.getElementById('current-room-title');
        const talkBtn = document.getElementById('talkBtn');
        const statusText = document.getElementById('status');

        // قائمة الغرف المحفوظة
        let rooms = [
            { id: 'general', name: '🌐 المحادثة العامة', password: '' }
        ];

        // بعد تسجيل الدخول الناجح
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            loginScreen.style.display = "none";
            chatsScreen.style.display = "block";
            userInfo.innerHTML = `المستخدم: ${responsePayload.name} 👤`;
            renderRooms();
        }

        // عرض الغرف في القائمة
        function renderRooms() {
            roomsContainer.innerHTML = '';
            rooms.forEach(room => {
                const isLocked = room.password !== '';
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => joinRoom(room);
                item.innerHTML = `
                    <span class="chat-title">${room.name} ${isLocked ? '🔒' : ''}</span>
                    <span>▶</span>
                `;
                roomsContainer.appendChild(item);
            });
        }

        // إنشاء غرفة جديدة بكلمة سر
        function createNewRoom() {
            const roomName = prompt("أدخل اسم الغرفة الجديدة:");
            if (!roomName) return;

            const password = prompt("أدخل كلمة سر للغرفة (أو اتركها فارغة لتكون عامة):");
            const newRoom = {
                id: 'room_' + Date.now(),
                name: roomName,
                password: password || ''
            };

            rooms.push(newRoom);
            renderRooms();
            alert("تم إنشاء الغرفة بنجاح! 🎉");
        }

        // الدخول للغرفة بالتحقق من كلمة السر
        function joinRoom(room) {
            if (room.password !== '') {
                const passInput = prompt(`غرفة "${room.name}" مقفولة! أدخل كلمة السر:`);
                if (passInput !== room.password) {
                    alert("❌ كلمة السر غير صحيحة!");
                    return;
                }
            }
            chatsScreen.style.display = "none";
            talkScreen.style.display = "block";
            currentRoomTitle.innerText = room.name;
        }

        function backToChats() {
            talkScreen.style.display = "none";
            chatsScreen.style.display = "block";
        }

        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // أحداث التحدث
        talkBtn.addEventListener('mousedown', startTalking);
        talkBtn.addEventListener('mouseup', stopTalking);
        talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
        talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

        function startTalking() {
            statusText.innerText = "الحالة: جارٍ الإرسال... 🔴";
            statusText.style.color = "#ff5252";
        }

        function stopTalking() {
            statusText.innerText = "الحالة: جاهز للاتصال 🟢";
            statusText.style.color = "#4caf50";
        }
    </script>
</body>
</html>
