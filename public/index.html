<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Talkie - Mecd Developer</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            padding: 10px;
            margin: 0;
        }
        .container {
            max-width: 440px;
            margin: 10px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        #login-screen { display: block; }
        .dev-badge {
            background: linear-gradient(45deg, #ff9800, #e91e63);
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.6;
        }
        .google-btn-container { display: flex; justify-content: center; margin-top: 20px; }
        #chats-screen { display: none; }
        .user-header {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #4caf50;
            font-weight: bold;
            font-size: 14px;
        }
        .create-btn {
            width: 100%;
            background: #2196f3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .chat-list { list-style: none; padding: 0; margin: 0; }
        .chat-item {
            background: #2c2c2e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .chat-title { font-weight: bold; font-size: 15px; }

        #talk-screen { display: none; }
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .call-actions button {
            background: #333;
            border: none;
            font-size: 16px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 4px;
        }
        .back-btn {
            background: #d32f2f;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .talk-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background-color: #e53935;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
            user-select: none;
            touch-action: manipulation;
            margin-top: 10px;
        }
        .talk-btn:active { transform: scale(0.95); background-color: #c62828; }

        .chat-box {
            height: 240px;
            background: #141414;
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            text-align: right;
            margin-top: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #2a2a2a;
        }
        .message-item {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            word-break: break-word;
            max-width: 85%;
        }
        .message-sender {
            font-weight: bold;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .delete-btn {
            font-size: 10px;
            color: #ff5252;
            cursor: pointer;
        }
        .media-preview {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            margin-top: 5px;
        }

        .input-bar {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .input-bar input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .media-btn-label {
            background: #333;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .send-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #call-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 16px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        video {
            width: 90%;
            max-height: 200px;
            border-radius: 12px;
            background: #000;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-screen">
            <div class="dev-badge">
                👋 أهلاً بك في موقع المطور مجد <br>
                <span style="font-size: 12px; opacity: 0.95;">Geliştirici Mecd'in Sitesine Hoş Geldiniz</span>
            </div>
            <h3>📻 Walkie Talkie</h3>
            <p style="color: #aaa; font-size: 14px;">سجل دخولك للانضمام والتحدث:</p>
            <div class="google-btn-container">
                <div id="g_id_onload"
                     data-client_id="456439585406-9db1t4v6ivjkipdhmgoun7p7q3tfllku.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard"></div>
            </div>
        </div>

        <!-- شاشة الغرف -->
        <div id="chats-screen">
            <div id="user-info" class="user-header"></div>
            <button class="create-btn" onclick="createNewRoom()">➕ إنشاء غرفة محادثة جديدة</button>
            <h4 style="text-align: right; margin-bottom: 10px; color: #888;">الغرف المتاحة 💬</h4>
            <div class="chat-list" id="roomsContainer"></div>
        </div>

        <!-- شاشة الغرفة / الدردشة -->
        <div id="talk-screen">
            <div class="room-header">
                <span id="current-room-title" style="font-weight:bold;">الغرفة</span>
                <div class="call-actions">
                    <button onclick="startCall('audio')" title="مكالمة صوتية">📞</button>
                    <button onclick="startCall('video')" title="مكالمة فيديو">📹</button>
                    <button class="back-btn" onclick="backToChats()">خروج</button>
                </div>
            </div>
            
            <button id="talkBtn" class="talk-btn">اضغط للتحدث 🎙️</button>

            <div class="chat-box" id="chatBox"></div>

            <div class="input-bar">
                <label class="media-btn-label" title="إرسال صورة أو فيديو">
                    📷
                    <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;" onchange="sendMedia(this)">
                </label>
                <input type="text" id="messageInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="send-btn">إرسال</button>
            </div>
        </div>

        <!-- شاشة المكالمات -->
        <div id="call-overlay">
            <h4 id="call-status" style="color: #4caf50;">جاري الاتصال...</h4>
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted style="width: 40%; max-height: 90px;"></video>
            <button onclick="endCall()" style="background:#e53935; color:white; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; margin-top:10px;">إنهاء المكالمة 📵</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUserName = "مستخدم";
        let currentRoomId = "general";
        let roomsList = [];

        function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            currentUserName = payload.name;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('chats-screen').style.display = "block";
            document.getElementById('user-info').innerText = `المستخدم: ${currentUserName} 👤`;
        }

        socket.on('init-rooms', (rooms) => { roomsList = rooms; renderRooms(); });
        socket.on('room-created', (newRoom) => { roomsList.push(newRoom); renderRooms(); });

        function renderRooms() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = '';
            roomsList.forEach(room => {
                const isLocked = room.password !== '';
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => joinRoom(room);
                item.innerHTML = `<span class="chat-title">${room.name} ${isLocked ? '🔒' : ''}</span> <span>▶</span>`;
                container.appendChild(item);
            });
        }

        function createNewRoom() {
            const name = prompt("أدخل اسم الغرفة الجديدة:");
            if (!name) return;
            const pass = prompt("أدخل كلمة سر للغرفة (أو اتركها فارغة):");
            socket.emit('create-room', { id: 'room_' + Date.now(), name: name, password: pass || '' });
        }

        function joinRoom(room) {
            if (room.password !== '') {
                const pass = prompt(`أدخل كلمة سر غرفة "${room.name}":`);
                if (pass !== room.password) return alert("❌ كلمة السر غير صحيحة!");
            }
            currentRoomId = room.id;
            socket.emit('join-room', currentRoomId);
            document.getElementById('chats-screen').style.display = "none";
            document.getElementById('talk-screen').style.display = "block";
            document.getElementById('current-room-title').innerText = room.name;
            document.getElementById('chatBox').innerHTML = '';
        }

        function backToChats() {
            document.getElementById('talk-screen').style.display = "none";
            document.getElementById('chats-screen').style.display = "block";
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            socket.emit('send-chat-message', { roomId: currentRoomId, sender: currentUserName, text: text });
            input.value = '';
        }

        function sendMedia(element) {
            const file = element.files[0];
            if (!file) return;

            const reader = new FileReader();
            const isVideo = file.type.startsWith('video/');
            
            reader.onload = function(e) {
                socket.emit('send-chat-message', {
                    roomId: currentRoomId,
                    sender: currentUserName,
                    file: e.target.result,
                    fileType: isVideo ? 'video' : 'image'
                });
                element.value = '';
            };
            reader.readAsDataURL(file);
        }

        // تحميل الرسائل القديمة للجميع (مثل واتساب)
        socket.on('load-old-messages', (messages) => {
            const box = document.getElementById('chatBox');
            box.innerHTML = '';
            messages.forEach(data => appendMessage(data));
        });

        // استقبال الرسالة الجديدة وعرضها عند الجميع فوراً
        socket.on('receive-chat-message', (data) => {
            appendMessage(data);
        });

        function appendMessage(data) {
            const box = document.getElementById('chatBox');
            const isMe = data.sender === currentUserName;
            const msg = document.createElement('div');
            msg.className = 'message-item';
            msg.id = data.id;
            
            msg.style.alignSelf = isMe ? 'flex-start' : 'flex-end';
            msg.style.background = isMe ? '#1b4332' : '#2c2c2e';
            msg.style.color = 'white';

            // زر الحذف يظهر حصرياً لصاحب الرسالة
            let deleteHtml = isMe ? `<span class="delete-btn" onclick="deleteMsg('${data.id}')">🗑️ حذف</span>` : '';
            let mediaHtml = '';

            if (data.file) {
                if (data.fileType === 'image') {
                    mediaHtml = `<br><img src="${data.file}" class="media-preview" onclick="window.open(this.src)">`;
                } else if (data.fileType === 'video') {
                    mediaHtml = `<br><video src="${data.file}" controls class="media-preview"></video>`;
                }
            }

            msg.innerHTML = `
                <div class="message-sender">
                    <span style="color:${isMe ? '#81c784':'#64b5f6'}">${data.sender}</span>
                    ${deleteHtml}
                </div>
                ${data.text} ${mediaHtml}
            `;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function deleteMsg(msgId) {
            if (confirm("هل تريد حذف هذه الرسالة عند الجميع؟")) {
                socket.emit('delete-message', { roomId: currentRoomId, msgId: msgId });
            }
        }

        socket.on('message-deleted', (msgId) => {
            const el = document.getElementById(msgId);
            if (el) el.remove();
        });

        let localStream;

        async function startCall(type) {
            document.getElementById('call-overlay').style.display = 'flex';
            document.getElementById('call-status').innerText = "جاري طلب الاتصال...";
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: type === 'video'
                });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) {
                alert("تعذر الوصول للكاميرا أو المايك!");
                endCall();
            }
        }

        function endCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('call-overlay').style.display = 'none';
            socket.emit('end-call', { roomId: currentRoomId });
        }

        socket.on('call-ended', () => {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('call-overlay').style.display = 'none';
        });

        function parseJwt(token) {
            var base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        }
    </script>
</body>
</html>
