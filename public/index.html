<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Talkie - جهاز لاسلكي</title>
    <!-- مكتبة تسجيل الدخول بجوجل -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 30px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        #user-info {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #4caf50;
            font-weight: bold;
            display: none;
        }
        .talk-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            background-color: #e53935;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.1s, background-color 0.2s;
        }
        .talk-btn:active {
            transform: scale(0.95);
            background-color: #c62828;
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📻 Walkie Talkie</h2>

        <!-- زر تسجيل الدخول مع ربط معالج الاستجابة callback -->
        <div class="google-btn-container">
            <div id="g_id_onload"
                 data-client_id="456439585406-9db1t4v6ivjkipdhmgoun7p7q3tfllku.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>

        <div id="user-info"></div>

        <hr style="border-color: #333; margin: 20px 0;">

        <!-- زر التحدث اللاسلكي -->
        <button id="talkBtn" class="talk-btn">اضغط للتحدث 🎙️</button>

        <div class="status" id="status">الحالة: جاهز للاتصال</div>
    </div>

    <!-- مكتبة Socket.io للاتصال المباشر -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const talkBtn = document.getElementById('talkBtn');
        const statusText = document.getElementById('status');
        const userInfo = document.getElementById('user-info');

        // دالة استقبال بيانات تسجيل الدخول من جوجل
        function handleCredentialResponse(response) {
            // فك تشفير البيانات التي أرسلها جوجل
            const responsePayload = parseJwt(response.credential);
            
            userInfo.style.display = "block";
            userInfo.innerHTML = `مرحباً بك: ${responsePayload.name} 👋`;
            
            console.log("ID: " + responsePayload.sub);
            console.log('Full Name: ' + responsePayload.name);
            console.log('Email: ' + responsePayload.email);
        }

        // دالة مساعدة لفك التشفير
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // أحداث الزر والتحدث
        talkBtn.addEventListener('mousedown', startTalking);
        talkBtn.addEventListener('mouseup', stopTalking);
        talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
        talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

        function startTalking() {
            statusText.innerText = "الحالة: جارٍ الإرسال... 🔴";
            statusText.style.color = "#ff5252";
        }

        function stopTalking() {
            statusText.innerText = "الحالة: جاهز للاتصال 🟢";
            statusText.style.color = "#4caf50";
        }
    </script>
</body>
</html>
