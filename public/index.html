<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Talkie - جهاز اتصال لاسلكي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app-container">
        <!-- شاشة التطبيق الرئيسية -->
        <div class="header">
            <span id="room-title">المحادثة العامة 🌐</span>
            <button id="back-btn" class="back-btn">رجوع ←</button>
        </div>

        <div class="main-content">
            <div id="talk-btn" class="talk-btn-container">
                <span>اضغط للتحدث</span>
                <div class="mic-icon">🎙️</div>
            </div>
            
            <div id="status-text" class="status-text">
                <span class="status-dot"></span> الحالة: جاهز للاتصال
            </div>

            <div id="chat-box" class="chat-box">
                <!-- الرسائل والمحادثات تظهر هنا -->
            </div>
        </div>

        <div class="footer-input">
            <input type="text" id="message-input" placeholder="اكتب رسالتك هنا...">
            <button id="send-btn" class="send-btn">إرسال 🚀</button>
        </div>
    </div>

    <!-- نافذة المكالمة الواردة -->
    <div id="call-overlay" class="call-overlay" style="display:none;">
        <h2 id="call-status">مكالمة واردة 📞</h2>
        <div id="incomingActionBtns" class="action-btns">
            <button onclick="acceptCall()" class="accept-btn">قبول</button>
        </div>
        <button id="endCallOnlyBtn" class="end-btn" style="display:none;" onclick="endCall()">إنهاء المكالمة</button>
    </div>

    <audio id="ringSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
